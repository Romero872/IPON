<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipon Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            padding: 20px;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            color: #777;
            margin-top: 5px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .percent {
            font-size: 32px;
            font-weight: bold;
        }

        .saved {
            text-align: right;
        }

        .saved small {
            color: #777;
        }

        .saved strong {
            display: block;
            font-size: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #2196f3;
            border-radius: 20px;
            transition: 0.3s;
        }

        .remaining {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #777;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
        }

        .peso {
            padding-left: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
        }

        input[type="date"] {
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fafafa;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .stat {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 15px 8px;
        }

        .stat span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat strong {
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .add-btn {
            background: #2196f3;
            color: white;
        }

        .reset-btn {
            background: #eee;
            color: #333;
        }

        .message {
            text-align: center;
            color: #777;
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 400px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💰 Ipon Tracker</h1>
        <p>Track your savings goal</p>
    </div>

    <!-- PROGRESS -->
    <div class="card">

        <div class="progress-info">

            <div>
                <small>Progress</small>
                <div class="percent" id="percent">0%</div>
            </div>

            <div class="saved">
                <small>Naiipon</small>
                <strong id="savedDisplay">₱0</strong>
            </div>

        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="remaining">
            <span id="remaining">₱2,500 remaining</span>
            <span id="targetDisplay">Target: ₱2,500</span>
        </div>

    </div>


    <!-- SETTINGS -->
    <div class="card">

        <div class="input-group">
            <label>🎯 Target Amount</label>

            <div class="input-box">
                <span class="peso">₱</span>
                <input
                    type="number"
                    id="target"
                    value="2500"
                    min="1"
                >
            </div>
        </div>


        <div class="input-group">
            <label>💰 Naiipon Na</label>

            <div class="input-box">
                <span class="peso">₱</span>
                <input
                    type="number"
                    id="saved"
                    value="0"
                    min="0"
                >
            </div>
        </div>


        <div class="input-group">
            <label>📅 Hulog Kada Araw</label>

            <div class="input-box">
                <span class="peso">₱</span>
                <input
                    type="number"
                    id="daily"
                    value="50"
                    min="0"
                >
            </div>
        </div>


        <div class="input-group">
            <label>🏁 Kailan Dapat Matapos?</label>

            <input
                type="date"
                id="targetDate"
            >
        </div>

    </div>


    <!-- STATISTICS -->
    <div class="card">

        <div class="stats">

            <div class="stat">
                <span>Kulang Pa</span>
                <strong id="need">₱2,500</strong>
            </div>

            <div class="stat">
                <span>Estimated Days</span>
                <strong id="days">50 days</strong>
            </div>

            <div class="stat">
                <span>Estimated Finish</span>
                <strong id="finish">-</strong>
            </div>

            <div class="stat">
                <span>Days Left</span>
                <strong id="daysLeft">-</strong>
            </div>

        </div>

        <div class="message" id="message">
            Keep going! 💪
        </div>

    </div>


    <!-- BUTTONS -->

    <button class="add-btn" onclick="addSavings()">
        + Add Today's Hulóg
    </button>

    <button class="reset-btn" onclick="resetSavings()">
        Reset
    </button>

</div>


<script>

    const targetInput = document.getElementById("target");
    const savedInput = document.getElementById("saved");
    const dailyInput = document.getElementById("daily");
    const dateInput = document.getElementById("targetDate");


    // Default target date = 30 days from today
    const today = new Date();

    const defaultDate = new Date();
    defaultDate.setDate(today.getDate() + 30);

    dateInput.value = formatDate(defaultDate);


    function formatDate(date) {

        const year = date.getFullYear();

        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");

        const day = String(
            date.getDate()
        ).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    function peso(amount) {

        return "₱" + Math.max(0, amount)
            .toLocaleString("en-PH", {
                maximumFractionDigits: 0
            });

    }


    function updateTracker() {

        let target = Number(targetInput.value);
        let saved = Number(savedInput.value);
        let daily = Number(dailyInput.value);


        if (target < 1 || isNaN(target)) {
            target = 1;
        }

        if (saved < 0 || isNaN(saved)) {
            saved = 0;
        }

        if (daily < 0 || isNaN(daily)) {
            daily = 0;
        }


        // Progress
        let percentage = (saved / target) * 100;

        if (percentage > 100) {
            percentage = 100;
        }


        const remaining = Math.max(
            0,
            target - saved
        );


        document.getElementById("percent")
            .textContent =
            percentage.toFixed(1) + "%";


        document.getElementById("progress")
            .style.width =
            percentage + "%";


        document.getElementById("savedDisplay")
            .textContent =
            peso(saved);


        document.getElementById("remaining")
            .textContent =
            peso(remaining) + " remaining";


        document.getElementById("targetDisplay")
            .textContent =
            "Target: " + peso(target);


        document.getElementById("need")
            .textContent =
            peso(remaining);


        // Estimated days
        if (remaining <= 0) {

            document.getElementById("days")
                .textContent = "Done!";

            document.getElementById("finish")
                .textContent = "Goal Reached 🎉";

        }

        else if (daily > 0) {

            const daysNeeded =
                Math.ceil(remaining / daily);


            document.getElementById("days")
                .textContent =
                daysNeeded + " days";


            const finishDate = new Date();

            finishDate.setDate(
                finishDate.getDate() + daysNeeded
            );


            document.getElementById("finish")
                .textContent =
                finishDate.toLocaleDateString(
                    "en-PH",
                    {
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    }
                );

        }

        else {

            document.getElementById("days")
                .textContent = "—";

            document.getElementById("finish")
                .textContent = "—";

        }


        // Days until selected target date

        if (dateInput.value) {

            const selectedDate =
                new Date(
                    dateInput.value + "T00:00:00"
                );

            const current =
                new Date();

            current.setHours(
                0, 0, 0, 0
            );


            const difference =
                selectedDate - current;


            const daysLeft =
                Math.ceil(
                    difference /
                    (1000 * 60 * 60 * 24)
                );


            if (daysLeft >= 0) {

                document.getElementById("daysLeft")
                    .textContent =
                    daysLeft + " days";

            }

            else {

                document.getElementById("daysLeft")
                    .textContent =
                    "Past date";

            }

        }


        // Message

        if (saved >= target) {

            document.getElementById("message")
                .textContent =
                "🎉 Naabot mo na ang savings goal!";

        }

        else if (daily > 0) {

            document.getElementById("message")
                .textContent =
                "Keep going! " +
                peso(remaining) +
                " pa ang kailangan. 💪";

        }

        else {

            document.getElementById("message")
                .textContent =
                "Maglagay ng daily hulog para makita ang estimated finish.";

        }

    }


    // Add daily savings

    function addSavings() {

        let saved =
            Number(savedInput.value) || 0;

        let daily =
            Number(dailyInput.value) || 0;


        saved += daily;

        savedInput.value = saved;

        updateTracker();

    }


    // Reset

    function resetSavings() {

        targetInput.value = 2500;

        savedInput.value = 0;

        dailyInput.value = 50;


        const newDate = new Date();

        newDate.setDate(
            newDate.getDate() + 30
        );

        dateInput.value =
            formatDate(newDate);


        updateTracker();

    }


    // Update whenever input changes

    targetInput.addEventListener(
        "input",
        updateTracker
    );

    savedInput.addEventListener(
        "input",
        updateTracker
    );

    dailyInput.addEventListener(
        "input",
        updateTracker
    );

    dateInput.addEventListener(
        "input",
        updateTracker
    );


    // Start
    updateTracker();

</script>

</body>
</html>
