<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ipon Tracker</title>

    <meta name="theme-color" content="#2196f3">
    <meta name="description" content="Simple Philippine Peso savings tracker">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            color: #777;
            margin-top: 5px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .percent {
            font-size: 34px;
            font-weight: bold;
            margin-top: 4px;
        }

        .saved {
            text-align: right;
        }

        .saved small {
            color: #777;
        }

        .saved strong {
            display: block;
            font-size: 20px;
            margin-top: 3px;
        }

        .progress-bar {
            height: 15px;
            background: #e5e5e5;
            border-radius: 20px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #2196f3;
            border-radius: 20px;
            transition: .3s;
        }

        .remaining {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #777;
            font-size: 13px;
            margin-top: 9px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fafafa;
        }

        .peso {
            padding-left: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px;
            font-size: 16px;
        }

        input[type="date"] {
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fafafa;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat {
            background: #f7f7f7;
            border-radius: 13px;
            padding: 15px 8px;
            text-align: center;
        }

        .stat span {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .stat strong {
            font-size: 17px;
        }

        .message {
            text-align: center;
            color: #777;
            margin-top: 15px;
            font-size: 14px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .add {
            background: #2196f3;
            color: white;
        }

        .reset {
            background: #e9e9e9;
            color: #333;
        }

        @media(max-width: 380px) {
            .remaining {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>💰 Ipon Tracker</h1>
        <p>Build your savings goal</p>
    </header>

    <section class="card">

        <div class="progress-top">

            <div>
                <small>Progress</small>
                <div class="percent" id="percent">0%</div>
            </div>

            <div class="saved">
                <small>Naiipon</small>
                <strong id="savedDisplay">₱0</strong>
            </div>

        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="remaining">
            <span id="remaining">₱2,500 remaining</span>
            <span id="targetDisplay">Target: ₱2,500</span>
        </div>

    </section>


    <section class="card">

        <div class="input-group">

            <label>🎯 Target Amount</label>

            <div class="input-box">
                <span class="peso">₱</span>

                <input
                    id="target"
                    type="number"
                    min="1"
                    value="2500"
                >
            </div>

        </div>


        <div class="input-group">

            <label>💰 Naiipon Na</label>

            <div class="input-box">
                <span class="peso">₱</span>

                <input
                    id="saved"
                    type="number"
                    min="0"
                    value="0"
                >
            </div>

        </div>


        <div class="input-group">

            <label>📅 Hulog Kada Araw</label>

            <div class="input-box">
                <span class="peso">₱</span>

                <input
                    id="daily"
                    type="number"
                    min="0"
                    value="50"
                >
            </div>

        </div>


        <div class="input-group">

            <label>🏁 Target Date</label>

            <input
                id="targetDate"
                type="date"
            >

        </div>

    </section>


    <section class="card">

        <div class="stats">

            <div class="stat">
                <span>Kulang Pa</span>
                <strong id="need">₱2,500</strong>
            </div>

            <div class="stat">
                <span>Estimated Days</span>
                <strong id="days">50 days</strong>
            </div>

            <div class="stat">
                <span>Estimated Finish</span>
                <strong id="finish">—</strong>
            </div>

            <div class="stat">
                <span>Days Left</span>
                <strong id="daysLeft">—</strong>
            </div>

        </div>

        <div class="message" id="message">
            Keep going! 💪
        </div>

    </section>


    <button class="add" id="addButton">
        + Add Today's Hulóg
    </button>

    <button class="reset" id="resetButton">
        Reset
    </button>

</div>


<script>

const targetInput = document.getElementById("target");
const savedInput = document.getElementById("saved");
const dailyInput = document.getElementById("daily");
const dateInput = document.getElementById("targetDate");


function peso(number) {

    return "₱" + Number(number).toLocaleString("en-PH", {
        maximumFractionDigits: 0
    });

}


function formatDate(date) {

    const year = date.getFullYear();

    const month = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


function setDefaultDate() {

    const date = new Date();

    date.setDate(
        date.getDate() + 30
    );

    dateInput.value =
        formatDate(date);

}


function updateTracker() {

    let target =
        Math.max(
            1,
            Number(targetInput.value) || 1
        );

    let saved =
        Math.max(
            0,
            Number(savedInput.value) || 0
        );

    let daily =
        Math.max(
            0,
            Number(dailyInput.value) || 0
        );


    const percentage =
        Math.min(
            100,
            (saved / target) * 100
        );


    const remaining =
        Math.max(
            0,
            target - saved
        );


    document.getElementById("percent")
        .textContent =
        percentage.toFixed(1) + "%";


    document.getElementById("progress")
        .style.width =
        percentage + "%";


    document.getElementById("savedDisplay")
        .textContent =
        peso(saved);


    document.getElementById("targetDisplay")
        .textContent =
        "Target: " + peso(target);


    document.getElementById("remaining")
        .textContent =
        peso(remaining) + " remaining";


    document.getElementById("need")
        .textContent =
        peso(remaining);


    if (remaining === 0) {

        document.getElementById("days")
            .textContent =
            "Done!";

        document.getElementById("finish")
            .textContent =
            "Goal Reached 🎉";

    }

    else if (daily > 0) {

        const estimatedDays =
            Math.ceil(
                remaining / daily
            );


        document.getElementById("days")
            .textContent =
            estimatedDays + " days";


        const finishDate =
            new Date();

        finishDate.setDate(
            finishDate.getDate() +
            estimatedDays
        );


        document.getElementById("finish")
            .textContent =
            finishDate.toLocaleDateString(
                "en-PH",
                {
                    month: "short",
                    day: "numeric",
                    year: "numeric"
                }
            );

    }

    else {

        document.getElementById("days")
            .textContent =
            "—";

        document.getElementById("finish")
            .textContent =
            "—";

    }


    if (dateInput.value) {

        const targetDate =
            new Date(
                dateInput.value +
                "T00:00:00"
            );


        const today =
            new Date();

        today.setHours(
            0,
            0,
            0,
            0
        );


        const difference =
            targetDate - today;


        const daysLeft =
            Math.ceil(
                difference /
                86400000
            );


        document.getElementById("daysLeft")
            .textContent =
            daysLeft >= 0
                ? daysLeft + " days"
                : "Past date";

    }


    if (saved >= target) {

        document.getElementById("message")
            .textContent =
            "🎉 Naabot mo na ang savings goal!";

    }

    else {

        document.getElementById("message")
            .textContent =
            "Keep going! " +
            peso(remaining) +
            " pa ang kailangan. 💪";

    }

}


targetInput.addEventListener(
    "input",
    updateTracker
);

savedInput.addEventListener(
    "input",
    updateTracker
);

dailyInput.addEventListener(
    "input",
    updateTracker
);

dateInput.addEventListener(
    "input",
    updateTracker
);


document.getElementById(
    "addButton"
).addEventListener(
    "click",
    function() {

        const current =
            Number(savedInput.value) || 0;

        const daily =
            Number(dailyInput.value) || 0;

        savedInput.value =
            current + daily;

        updateTracker();

    }
);


document.getElementById(
    "resetButton"
).addEventListener(
    "click",
    function() {

        targetInput.value = 2500;
        savedInput.value = 0;
        dailyInput.value = 50;

        setDefaultDate();

        updateTracker();

    }
);


// Register service worker

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "service-worker.js"
            );

        }
    );

}


setDefaultDate();
updateTracker();

</script>

</body>
</html>
